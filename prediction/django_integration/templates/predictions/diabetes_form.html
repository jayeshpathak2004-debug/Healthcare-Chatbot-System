{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Diabetes Risk Prediction</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Predict</button>
  </form>

  {% if result %}
  <div class="alert {% if result.prediction == 'Diabetic' %}alert-danger{% else %}alert-success{% endif %} mt-3">
    <h4>Result: {{ result.prediction }}</h4>
    <p>Confidence: {{ result.probability }}%</p>
    <p>Risk Segment: {{ result.risk_segment }}</p>
    <p><small>Model used: {{ result.model_used }}</small></p>
  </div>
  {% endif %}
</div>
{% endblock %}
